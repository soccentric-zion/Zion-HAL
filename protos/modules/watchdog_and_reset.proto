// Source: src/watchdog_and_reset_lib/watchdog_and_reset_lib.h
//         (class WatchdogAndResetTesting : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.watchdog_and_reset;

import "common.proto";

// Config for the watchdog_and_reset module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in WatchdogAndResetTesting):
//   testWatchdogTimerFunctionality
//   testWatchdogTimeoutConfiguration
//   testWatchdogResetGeneration
//   testWatchdogInterruptGeneration
//   testPoweronReset
//   testHardwareResetButton
//   testSoftwareReset
//   testWatchdogReset
//   testThermalReset
//   testResetReasonLogging
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single watchdog_and_reset test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
