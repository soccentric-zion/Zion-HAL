// Source: src/audio_interfaces/audio_interfaces.h  (class AudioInterfaces : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.audio_interfaces;

import "common.proto";

// Config for the audio_interfaces module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in AudioInterfaces):
//   testI2sInterface
//   testAudioInput
//   testAudioOutput
//   testAudioSampleRates
//   testAudioBitDepths
//   testMultiChannelAudio
//   testAudioDmaTransfers
//   testAudioLatency
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single audio_interfaces test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
