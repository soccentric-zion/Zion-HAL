// Source: src/system_integration_lib/system_integration_lib.h
//         (class SystemIntegrationTesting : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.system_integration;

import "common.proto";

// Config for the system_integration module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in SystemIntegrationTesting):
//   testConcurrentOperationOfAllSubsystems
//   testResourceContentionHandling
//   testSystemBottleneckIdentification
//   testEndtoendLatency
//   testSystemThroughput
//   testMultimodalAiWorkloads
//   testAutonomousDrivingStack
//   testSensorFusionPipeline
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single system_integration test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
