// Source: src/ethernet_switch_lib/ethernet_switch_lib.h  (class EthernetSwitchTesting : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.ethernet_switch;

import "common.proto";

// Config for the ethernet_switch module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in EthernetSwitchTesting):
//   testSwitchPortFunctionality
//   testSwitchForwardingTable
//   testSwitchVlanSupport
//   testSwitchQos
//   testSwitchPortMirroring
//   testSwitchStatistics
//   testRedundantSwitchOperation
//   testSwitchFailover
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single ethernet_switch test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
