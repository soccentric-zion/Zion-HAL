// Source: src/gnss_lib/gnss_lib.h  (class GnssTesting : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.gnss;

import "common.proto";

// Config for the gnss module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in GnssTesting):
//   testGpsSignalReception
//   testGlonassSupport
//   testGalileoSupport
//   testBeidouSupport
//   testPositionAccuracy
//   testTimetofirstfix
//   testGnssAntennaConnection
//   testAgpsFunctionality
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single gnss test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
