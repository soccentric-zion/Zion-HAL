// Source: src/display_interfaces/display_interfaces.h  (class DisplayInterfaces : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.display_interfaces;

import "common.proto";

// Config for the display_interfaces module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in DisplayInterfaces):
//   testDisplayPortOutput
//   testHdmiOutput
//   testMultiDisplaySupport
//   testVariousResolutions
//   testVariousRefreshRates
//   testHdrSupport
//   testDisplayHotPlugDetection
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single display_interfaces test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
