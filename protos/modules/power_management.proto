// Source: src/power_management_lib/power_management_lib.h
//         (class PowerManagementTesting : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.power_management;

import "common.proto";

// Config for the power_management module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in PowerManagementTesting):
//   testMaximumPerformanceMode
//   testPoweroptimizedModes
//   testIdlePowerConsumption
//   testSleepStates
//   testPowerStateTransitions
//   testWakeupSources
//   testPowerButtonFunctionality
//   test12vAsilQsLRail
//   test12vAsilQsRRail
//   testAllInternalVoltageRails
//   testPowerSequencing
//   testPoweronReset
//   testBrownoutDetection
//   testOvervoltageProtection
//   testUndervoltageProtection
//   testOvercurrentProtection
//   testPowerSupplyRejection
//   testRealtimePowerConsumption
//   testPercomponentPowerMeasurement
//   testPowerEfficiencyCalculation
//   testBatteryCharging
//   testUpsFunctionality
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single power_management test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
