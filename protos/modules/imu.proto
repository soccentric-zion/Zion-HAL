// Source: src/imu_lib/imu_lib.h  (class ImuTesting : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.imu;

import "common.proto";

// Config for the imu module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in ImuTesting):
//   test3axisAccelerometer
//   test3axisGyroscope
//   test3axisMagnetometer
//   testImuDataRate
//   testImuAccuracy
//   testImuCalibration
//   testImuTemperatureCompensation
//   testImuToOrinInterface
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single imu test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
