// Source: src/system_memory_lib/system_memory_lib.h  (class SystemMemoryTesting : public TestBase)
//
// Raspberry Pi 5 target: 4 GB or 8 GB LPDDR4X-4267, 64-bit interface.
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.system_memory;

import "common.proto";

// Config for the system_memory module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in SystemMemoryTesting):
//   testAll64gbMemoryAccessibility
//   testMemoryBankTesting
//   test256bitMemoryInterface
//   testMemoryClockFrequency
//   testMemoryBandwidth
//   testMemoryLatencyMeasurements
//   testMemoryErrorCorrection
//   testMemoryThermalBehavior
//   testSequentialReadwritePerformance
//   testRandomReadwritePerformance
//   testMemoryAllocationdeallocation
//   testMemoryFragmentationHandling
//   testOutofmemoryConditions
//   testMemoryLeaksDetection
//   testDmaTofromMemory
//   testConcurrentMemoryAccessPatterns
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single system_memory test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
