// Source: src/security_features_lib/security_features_lib.h
//         (class SecurityFeaturesTesting : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.security_features;

import "common.proto";

// Config for the security_features module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in SecurityFeaturesTesting):
//   testBootRomExecution
//   testBootloaderSignatureVerification
//   testKernelSignatureVerification
//   testSecureBootChainOfTrust
//   testHardwareRootOfTrust
//   testSecureStorage
//   testCryptographicAccelerators
//   testHardwareRandomNumberGenerator
//   testMemoryEncryption
//   testDebugPortSecurity
//   testJtagSecurity
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single security_features test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
