// Source: src/mcu_interface_lib/mcu_interface_lib.h  (class McuInterfaceTesting : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.mcu_interface;

import "common.proto";

// Config for the mcu_interface module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in McuInterfaceTesting):
//   testMcuCommunicationInterface
//   testMcuFirmwareOperation
//   testMcuWatchdog
//   testMcuGpioInterface
//   testMcuSpiInterface
//   testMcuUartInterface
//   testMcuDmsInterface
//   testMcuToOrinDataTransfer
//   testSecondaryMcuRedundancy
//   testMcuFailoverMechanism
//   testMcuSynchronization
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single mcu_interface test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
