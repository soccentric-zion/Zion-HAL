// Source: src/camera_module3_lib/camera_module3_lib.h  (class CameraModule3Testing : public TestBase)
//
// Camera Module 3 (Sony IMX708): 12.3 MP, PDAF, HDR, MIPI CSI-2 2-lane via RP1 Unicam.
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.camera_module3;

import "common.proto";

// Config for the camera_module3 module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in CameraModule3Testing):
//   testCameraDetection
//   testSensorResolution
//   testAutofocus
//   testHdrMode
//   testStillCapture
//   testMipiCsiInterface
//   testPixelFormats
//   testVideoStreaming
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single camera_module3 test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
