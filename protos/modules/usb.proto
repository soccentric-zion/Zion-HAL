// Source: src/usb_lib/usb_lib.h  (class UsbTesting : public TestBase)
//
// Raspberry Pi 5 target: 2× USB 3.0 + 2× USB 2.0 via RP1 xHCI controller.
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.usb;

import "common.proto";

// Config for the usb module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in UsbTesting):
//   testUsbHostMode
//   testUsbDeviceMode
//   testUsb32Gen2Speed
//   testUsb31Gen1BackwardCompatibility
//   testUsb20BackwardCompatibility
//   testUsbPowerDelivery
//   testMultipleUsbDeviceEnumeration
//   testUsbHotplugDetection
//   testUsbSuspendresume
//   testUsbMassStorageDevices
//   testUsbCameras
//   testUsbNetworkAdapters
//   testUsbHubs
//   testUsbAudioDevices
//   testUsbHidDevices
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single usb test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
