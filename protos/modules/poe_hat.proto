// Source: src/poe_hat_lib/poe_hat_lib.h  (class PoeHatTesting : public TestBase)
//
// Raspberry Pi PoE+ HAT: IEEE 802.3at PoE+ (25.5 W), 5V/5A DC-DC, fan PWM via ATtiny I2C.
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.poe_hat;

import "common.proto";

// Config for the poe_hat module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in PoeHatTesting):
//   testPoeHatDetection
//   testPoePowerNegotiation
//   testPowerMonitoring
//   testFanControl
//   testFanSpeed
//   testThermalProtection
//   testVoltageRegulator
//   testPowerDelivery
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single poe_hat test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
