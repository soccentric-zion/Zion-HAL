// Source: src/gpu_lib/gpu_lib.h  (class GpuTesting : public TestBase)
//
// Raspberry Pi 5 target: VideoCore VII (no CUDA / NVENC — tests probe VC7 paths).
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.gpu;

import "common.proto";

// Config for the gpu module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in GpuTesting):
//   testCudaCoresFunctionality
//   testTensorCoresOperation
//   testGpuClockFrequencyStabilityAndThrottling
//   testGraphicsProcessingClustersBothClusters
//   testTextureProcessingClustersAll8Tpcs
//   testStreamingMultiprocessorsAll16Sms
//   testRenderOutputUnitsAll32Rops
//   testTextureMappingUnitsAll64Tmus
//   testL1CachePerSm
//   testL2Cache
//   testCacheCoherencyAndHitRates
//   testMemoryBandwidthToGpu
//   testInt8PerformanceVerification
//   testInt8SparsePerformance
//   testFp32ComputePerformance
//   testFp16ComputePerformance
//   testFp16TensorCorePerformance
//   testMixedPrecisionOperations
//   testGpuThermalThrottlingBehavior
//   testGpuPowerConsumptionAtVariousLoads
//   testSustainedPerformanceOverTime
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single gpu test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
