// Source: src/video_encode_decode_lib/video_encode_decode_lib.h
//         (class VideoEncodeDecodeTesting : public TestBase)
//
// Raspberry Pi 5 target: VideoCore VII H.264/H.265 hardware codec via V4L2 M2M.
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.video_encode_decode;

import "common.proto";

// Config for the video_encode_decode module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in VideoEncodeDecodeTesting):
//   -- Encoding --
//   testH265Encoding
//   testH264Encoding
//   testAv1Encoding
//   testMultipleStreamEncoding
//   testVariousResolutions
//   testVariousBitrates
//   testVariousFrameRates
//   testEncoderQualitySettings
//   testEncoderLatency
//   testEncoderPowerConsumption
//   -- Decoding --
//   testH265Decoding
//   testH264Decoding
//   testAv1Decoding
//   testVp9Decoding
//   testMultipleStreamDecoding
//   test4k8kDecoding
//   testDecoderLatency
//   testCorruptStreamHandling
//   -- Image processing --
//   testJpegCompression
//   testJpegDecompression
//   testImageScalingOperations
//   testYuvFormatConversions
//   testColorSpaceConversions
//   (see source for any additional tests)
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single video_encode_decode test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
