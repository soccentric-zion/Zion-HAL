// Source: src/cpu_lib/cpu_lib.h  (class CpuTesting : public TestBase)
//
// Raspberry Pi 5 target: BCM2712 quad-core Cortex-A76 @ 2.4 GHz.
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.cpu;

import "common.proto";

// Config for the cpu module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in CpuTesting):
//   testAll12CpuCoresFunctionality
//   testCpuCoreFrequencyScaling
//   testIndividualCoreStressTesting
//   testMulticoreSynchronization
//   testCpuClusterCommunication
//   testCoreAffinityAndThreadMigration
//   testCpuThermalThrottling
//   testCpuPowerStatesAndTransitions
//   testL1Cache
//   testL2Cache
//   testL3Cache
//   testSystemCache
//   testCacheCoherencyBetweenClusters
//   testCacheLineInvalidation
//   testCacheBandwidthAndLatency
//   testSinglethreadedPerformance
//   testMultithreadedPerformance
//   testContextSwitchingPerformance
//   testInterruptLatency
//   testDmaOperations
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single cpu test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
