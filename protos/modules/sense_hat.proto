// Source: src/sense_hat_lib/sense_hat_lib.h  (class SenseHatTesting : public TestBase)
//
// Raspberry Pi Sense HAT (V1/V2): 8×8 LED matrix, HTS221, LPS25H, LSM9DS1, 5-way joystick.
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.sense_hat;

import "common.proto";

// Config for the sense_hat module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in SenseHatTesting):
//   testSenseHatDetection
//   testLedMatrix
//   testTemperatureSensor
//   testHumiditySensor
//   testPressureSensor
//   testImuSensors
//   testJoystick
//   testI2cBusIntegrity
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single sense_hat test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
