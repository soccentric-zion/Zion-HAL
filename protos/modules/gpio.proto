// Source: src/gpio_lib/gpio_lib.h  (class GpioTesting : public TestBase)
//
// Note: GpioDirection, GpioPullMode, and GpioPin are internal test-harness types
// used to simulate pin state; they are not part of the public module config/result
// contract and are intentionally omitted here (Ambiguity A3 resolution: omit).
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.gpio;

import "common.proto";

// Config for the gpio module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in GpioTesting):
//   testGpioout1
//   testGpioout2
//   testGpioout3
//   testGpioout4
//   testGpioOutputVoltageLevels
//   testGpioOutputCurrentDriveCapability
//   testGpioOutputSwitchingSpeed
//   testGpioPwmOutput
//   testGpioPulluppulldownResistors
//   testGpioin1
//   testGpioin2
//   testGpioin3
//   testGpioin4
//   testGpioInputVoltageThreshold
//   testGpioInputDebouncing
//   testGpioInterruptGeneration
//   testGpioTimerCounterFunctionality
//   testGpioSchmittTrigger
//   testGpioDirectionChange
//   testGpioConcurrentAccess
//   testGpioInterruptLatency
//   testGpioReservedPins
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single gpio test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
