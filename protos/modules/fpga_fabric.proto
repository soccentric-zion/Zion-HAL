// Source: src/fpga_fabric_lib/fpga_fabric_lib.h
//         (class FpgaFabricTesting : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.fpga_fabric;

import "common.proto";

// Config for the fpga_fabric module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in FpgaFabricTesting):
//   testFpgaManagerPresence
//   testFpgaManagerStateRead
//   testPlAxiDeviceEnumeration
//   testPlClockControl
//   testKriaAcceleratorStack
//   testPlInterruptLines
//   testPlGpioControllerPresence
//   testPsPlRegisterBackend
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single fpga_fabric test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}