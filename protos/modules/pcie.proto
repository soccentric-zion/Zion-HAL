// Source: src/pcie_lib/pcie_lib.h  (class PcieTesting : public TestBase)
//
// Raspberry Pi 5 target: PCIe Gen 3 x1 via RP1 south-bridge.
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.pcie;

import "common.proto";

// Config for the pcie module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in PcieTesting):
//   testPcieLinkTraining
//   testPcieLinkSpeed
//   testPcieLinkWidth
//   testPcieLaneReversal
//   testPcieHotplugSupport
//   testPcieReadBandwidth
//   testPcieWriteBandwidth
//   testPcieLatency
//   testPcieErrorHandling
//   testPciePowerManagement
//   testSecondaryPcieLinkTraining
//   testPcieX4Bandwidth
//   testPcieX4LaneFunctionality
//   testConcurrentPcieX8AndX4Operation
//   testNvmeSsdConnectivity
//   testGpuAddinCardSupport
//   testNetworkAdapterConnectivity
//   testMultiplePcieDeviceEnumeration
//   testPcieSwitchCompatibility
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single pcie test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
