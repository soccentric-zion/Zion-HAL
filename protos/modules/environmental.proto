// Source: src/environmental_lib/environmental_lib.h  (class EnvironmentalTesting : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.environmental;

import "common.proto";

// Config for the environmental module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in EnvironmentalTesting):
//   testTemperatureRange
//   testHumidityResistance
//   testVibrationResistance
//   testShockResistance
//   testEmiemcCompliance
//   testEsdProtection
//   testSaltSprayResistance
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single environmental test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}
