// Source: src/rpu_lib/rpu_lib.h
//         (class RpuTesting : public TestBase)
//
// Field-numbering rules: numbers start at 1, never renumber, mark removed fields reserved.

syntax = "proto3";

package hal.modules.rpu;

import "common.proto";

// Config for the rpu module.
// Leave test_names empty to run all available tests.
//
// Available tests (in declaration order in RpuTesting):
//   testRpuRemoteprocPresence
//   testRpuCoreState
//   testRpuFirmwareAvailability
//   testRpuOperatingMode
//   testRpmsgIpcPresence
//   testRpuReservedMemory
//   testRpuStartStop
message Config {
  // Names of individual tests to execute; empty list = run all tests.
  repeated string test_names = 1;
}

// Result from a single rpu test run.
message Result {
  reserved 1;
  reserved "test_results";
  repeated hal.common.TestResult results = 2;
}